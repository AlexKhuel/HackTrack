services:
  - type: web
    name: irvine-hacks-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix api_services
    startCommand: npm --prefix api_services start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_DB_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false

  - type: web
    name: irvine-hacks-web
    runtime: static
    buildCommand: npm ci --prefix web_client && npm run --prefix web_client build
    staticPublishPath: web_client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        value: https://irvine-hacks-api.onrender.com
